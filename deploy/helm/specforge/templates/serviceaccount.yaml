{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "specforge.serviceAccountName" . }}
  labels:
    {{- include "specforge.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No token is mounted: the platform authenticates to PostgreSQL, object storage
# and Kafka with their own credentials, and has no reason to call the
# Kubernetes API. A mounted token is an unnecessary credential inside a pod
# that processes untrusted content.
automountServiceAccountToken: false
{{- end }}

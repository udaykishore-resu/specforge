# CodeQL analysis.
#
# Trivy and govulncheck in ci.yml answer "does this depend on something with a
# known vulnerability?". CodeQL answers a different question — "does this code
# contain a vulnerability nobody has reported yet?" — which is the one that
# matters for a platform whose own code is the security boundary.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query pattern reaches this code without
    # waiting for someone to open a pull request.
    - cron: "27 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: javascript-typescript
            build-mode: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: "1.24"

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # security-extended adds the query set that covers the classes this
          # platform actually cares about: injection into SQL that is assembled
          # rather than parameterised, and paths where a tenant identifier
          # reaches a query without going through the session variable.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}

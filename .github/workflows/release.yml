# SpecForge release.
#
# Triggered by a semantic version tag. The pipeline does three things that
# matter beyond producing artifacts:
#
#   * it re-runs the full verification, including the database invariants,
#     against the tagged commit — a release is not the moment to trust that CI
#     passed on a branch that has since moved;
#   * it publishes SLSA provenance and an SBOM for every image, so a deployment
#     can verify that what it is about to run came from this pipeline and this
#     commit;
#   * it refuses to publish a release whose version does not match the tag,
#     because an image that misreports its own version cannot be correlated with
#     an incident or an audit finding.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.24"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: specforge
          POSTGRES_PASSWORD: specforge
          POSTGRES_DB: specforge_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U specforge"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      TEST_DSN: "host=127.0.0.1 port=5432 user=specforge password=specforge dbname=specforge_test sslmode=disable"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Static checks and tests
        run: make check

      - name: Database guarantees
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          SF_DB_DSN="$TEST_DSN" go run ./cmd/specforge-migrate up
          psql "$TEST_DSN" -v ON_ERROR_STOP=1 -f test/isolation/invariants.sql
          SF_TEST_DSN="$TEST_DSN" go test ./test/integration/... -count=1

      - name: The binary reports the tag it was built from
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          make build VERSION="$TAG"
          REPORTED=$(./bin/specforge-api --version 2>/dev/null | head -1 || true)
          echo "tag=$TAG reported=$REPORTED"
          case "$REPORTED" in
            *"$TAG"*) echo "version matches the tag" ;;
            *) echo "::error::the binary reports '$REPORTED', which does not contain the tag '$TAG'"; exit 1 ;;
          esac

  images:
    name: Build and publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        component: [api, worker, web]
    outputs:
      digest-api: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=$VERSION"
            echo "commit=$(git rev-parse --short HEAD)"
            echo "date=$(git log -1 --format=%cI)"
            # Prereleases (1.2.0-rc.1) must not move the `latest` tag.
            case "$VERSION" in
              *-*) echo "latest=false" ;;
              *)   echo "latest=true"  ;;
            esac
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/specforge-${{ matrix.component }}:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/specforge-${{ matrix.component }}:sha-${{ steps.meta.outputs.commit }}
            ${{ steps.meta.outputs.latest == 'true' && format('{0}/{1}/specforge-{2}:latest', env.REGISTRY, github.repository_owner, matrix.component) || '' }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ github.repository_owner }}/specforge-${{ matrix.component }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Scan the published image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ github.repository_owner }}/specforge-${{ matrix.component }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  chart:
    name: Publish the Helm chart
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: The chart version matches the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CHART=$(grep '^version:' deploy/helm/specforge/Chart.yaml | awk '{print $2}')
          APP=$(grep '^appVersion:' deploy/helm/specforge/Chart.yaml | awk '{print $2}' | tr -d '"')
          if [ "$CHART" != "$VERSION" ] || [ "$APP" != "$VERSION" ]; then
            echo "::error::Chart.yaml says version=$CHART appVersion=$APP but the tag is $VERSION"
            exit 1
          fi

      - name: Package and push
        run: |
          helm lint deploy/helm/specforge
          helm package deploy/helm/specforge --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} --password-stdin
          helm push dist/specforge-*.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  release:
    name: GitHub release
    needs: [images, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PREVIOUS=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || echo "")
          {
            echo "notes<<EOF"
            if [ -n "$PREVIOUS" ]; then
              echo "## Changes since $PREVIOUS"
              echo
              git log --pretty='- %s (%h)' "$PREVIOUS..${GITHUB_REF_NAME}"
            else
              echo "## Initial release"
            fi
            echo
            echo "## Verification"
            echo
            echo 'Every image carries SLSA provenance. Verify before deploying:'
            echo
            echo '```bash'
            echo "gh attestation verify oci://ghcr.io/${{ github.repository_owner }}/specforge-api:$VERSION \\"
            echo "  --repo ${{ github.repository }}"
            echo '```'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: false
